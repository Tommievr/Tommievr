<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Tidebot</title>
<meta name="theme-color" content="#eef3f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#081416" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='3' r='2' fill='%230b7f8a'/%3E%3Crect x='15' y='3' width='2' height='5' fill='%230b7f8a'/%3E%3Crect x='3' y='7' width='26' height='22' rx='8' fill='%230b7f8a'/%3E%3Ccircle cx='11' cy='15.5' r='2.3' fill='%23fff'/%3E%3Ccircle cx='21' cy='15.5' r='2.3' fill='%23fff'/%3E%3Cpath d='M8.5 23c1.9 0 1.9-2 3.8-2s1.9 2 3.7 2 1.9-2 3.7-2 1.9 2 3.8 2' stroke='%23fff' stroke-width='1.8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Tidebot: one narrow column. Account value and its chart on top, then the open positions (biggest coins first)
   and each coin's result. Everything is worked out in the browser from the data below, so the live prices (every
   minute) move every number on the page together. */
:root{
  --bg:#eef3f3; --card:#ffffff; --fg:#0d1d22; --muted:#55696f; --faint:#7f9297; --line:#dbe5e6;
  --accent:#0b7f8a; --accent-soft:rgba(11,127,138,.11); --on-accent:#ffffff;
  --up:#0d8559; --up-soft:rgba(13,133,89,.11); --down:#c93a28; --down-soft:rgba(201,58,40,.10);
  --warn:#a8620b; --warn-soft:rgba(168,98,11,.10);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --display:"Space Grotesk",var(--ui);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081416; --card:#0f1f22; --fg:#e2eef0; --muted:#8fa6ab; --faint:#667f84; --line:#1c3337;
  --accent:#37c4d0; --accent-soft:rgba(55,196,208,.13); --on-accent:#062226;
  --up:#41d29a; --up-soft:rgba(65,210,154,.13); --down:#ff7a66; --down-soft:rgba(255,122,102,.13);
  --warn:#f0b23e; --warn-soft:rgba(240,178,62,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081416; --card:#0f1f22; --fg:#e2eef0; --muted:#8fa6ab; --faint:#667f84; --line:#1c3337;
  --accent:#37c4d0; --accent-soft:rgba(55,196,208,.13); --on-accent:#062226;
  --up:#41d29a; --up-soft:rgba(65,210,154,.13); --down:#ff7a66; --down-soft:rgba(255,122,102,.13);
  --warn:#f0b23e; --warn-soft:rgba(240,178,62,.12); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--ui);
  padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 36px max(16px,env(safe-area-inset-left))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .muted{color:var(--muted)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:36px;height:36px;flex:none}
.brand h1{font:700 1.4rem/1 var(--display);letter-spacing:-.015em;margin:0}
.brand p{margin:3px 0 0;font-size:.78rem;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;font-weight:600;padding:6px 11px;border-radius:99px;
  background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.live{color:var(--fg)}
.status.live .dot{background:var(--up);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--up-soft)}60%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.status.live .dot{animation:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.label{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font:600 2.7rem/1.05 var(--display);letter-spacing:-.025em;margin-top:6px}
.delta{font-weight:600;margin-top:6px;font-size:.95rem}
.delta span+span{color:var(--muted);font-weight:500}
.delta-note{font-size:.76rem;color:var(--muted);margin-top:2px}
.chart{position:relative;height:170px;margin:12px 0 4px;touch-action:pan-y}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart .ylab{position:absolute;left:0;font-size:.68rem;color:var(--faint);line-height:1}
.chart .mv{position:absolute;top:0;font-size:.68rem;font-weight:600;color:var(--accent);line-height:1;white-space:nowrap}
.tip{position:absolute;top:-8px;transform:translate(-50%,-100%);background:var(--fg);color:var(--bg);font-size:.72rem;font-weight:600;
  padding:4px 8px;border-radius:7px;pointer-events:none;white-space:nowrap;display:none}
.tip div{font-weight:500;opacity:.85}
.axis{display:flex;justify-content:space-between;font-size:.7rem;color:var(--faint)}
.controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg);border-radius:11px;padding:3px;gap:2px}
.seg button{font:600 .78rem var(--ui);color:var(--muted);background:none;border:0;padding:7px 13px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.stats dt{font-size:.72rem;color:var(--muted)}
.stats dd{margin:3px 0 0;font:600 1.04rem var(--display)}
h2{font:600 1.05rem var(--display);margin:10px 2px 0;display:flex;align-items:center;gap:8px}
h2 .count{font:600 .72rem var(--ui);background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:99px}
.list{display:flex;flex-direction:column;gap:10px}
.pos-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.coin{font:700 1.22rem var(--display);display:flex;align-items:center;gap:9px}
.pill{font:600 .68rem var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px}
.pill.long{background:var(--up-soft);color:var(--up)}
.pill.short{background:var(--down-soft);color:var(--down)}
.pnl{text-align:right;font:600 1.18rem/1.15 var(--display)}
.pnl small{display:block;font:600 .76rem var(--ui)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.grid4 span{display:block;font-size:.7rem;color:var(--muted)}
.grid4 b{font:600 .94rem var(--display);overflow-wrap:anywhere}
.grid4 small{display:block;font-size:.72rem;font-weight:600;margin-top:1px}
.grid4.minor{padding-top:10px;border-top:1px dashed var(--line)}
.grid4.minor b{font-size:.86rem}
h2 .sub{font:500 .74rem var(--ui);color:var(--muted)}
.coins{padding:4px 16px}
.row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font:700 .7rem var(--display);
  background:var(--accent-soft);color:var(--accent)}
.what{min-width:0}
.what .l1{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-weight:600}
.what .l2{font-size:.78rem;color:var(--muted);margin-top:1px}
.amt{text-align:right;font:600 .95rem var(--display);white-space:nowrap}
.amt small{display:block;font:600 .76rem var(--ui);margin-top:1px}
.empty{color:var(--muted);font-size:.9rem;padding:18px 2px;text-align:center}
.banner{border-radius:14px;padding:11px 14px;font-size:.86rem;border:1px solid var(--warn);color:var(--warn);background:var(--warn-soft)}
.banner.bad{border-color:var(--down);color:var(--down);background:var(--down-soft)}
footer{font-size:.75rem;color:var(--faint);text-align:center;line-height:1.6;padding:6px 8px 0}
@media (max-width:380px){.grid4{grid-template-columns:repeat(2,1fr)}.big{font-size:2.3rem}.stats dd{font-size:.95rem}}
</style></head><body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="3" r="2" fill="var(--accent)"/><rect x="15" y="3" width="2" height="5" fill="var(--accent)"/><rect x="3" y="7" width="26" height="22" rx="8" fill="var(--accent)"/><circle cx="11" cy="15.5" r="2.3" fill="var(--on-accent)"/><circle cx="21" cy="15.5" r="2.3" fill="var(--on-accent)"/><path d="M8.5 23c1.9 0 1.9-2 3.8-2s1.9 2 3.7 2 1.9-2 3.7-2 1.9 2 3.8 2" stroke="var(--on-accent)" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <div><h1>Tidebot</h1><p>Kraken Futures watcher</p></div>
    </div>
    <span id="status" class="status"><span class="dot"></span><span id="statusText">Loading</span></span>
  </header>
  <div id="banner" class="banner" hidden></div>
  <section class="card" aria-labelledby="valueLabel">
    <div class="label" id="valueLabel">Account value</div>
    <div class="big num" id="value">–</div>
    <div class="delta num" id="delta"></div>
    <div class="delta-note num" id="deltaNote" hidden></div>
    <div class="chart" id="chart" role="img" aria-label="Account value over time"><div class="tip num" id="tip"></div></div>
    <div class="axis num"><span id="axisFrom"></span><span id="axisTo"></span></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Chart range">
        <button type="button" data-range="1d">24h</button><button type="button" data-range="7d">7 days</button><button type="button" data-range="all">All</button>
      </div>
    </div>
    <dl class="stats">
      <div><dt>Free margin</dt><dd class="num" id="free">–</dd></div>
      <div><dt>Leverage</dt><dd class="num" id="lev">–</dd></div>
      <div><dt>In positions</dt><dd class="num" id="notional">–</dd></div>
    </dl>
  </section>
  <h2>Open positions <span class="count" id="posCount">0</span></h2>
  <div class="list" id="positions"></div>
  <h2>Results per coin <span class="sub num" id="coinsSince"></span></h2>
  <div class="card coins" id="coins"></div>
  <footer id="foot"></footer>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
  "use strict";
  let D = JSON.parse(document.getElementById("data").textContent);
  const SPOT = {BTC: "XBTUSD"};               // Kraken spot pairs; other coins: COIN + "USD"
  const LIVE_FOR = 3 * 60e3;                    // a live price this recent counts as live
  const live = {};                              // coin -> {px, t} from Kraken's public prices
  let lastLive = 0;
  let range = "all";
  try { range = localStorage.getItem("tidebot.range") || "all"; } catch (e) { /* no storage: default range */ }

  const $ = id => document.getElementById(id);
  const make = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const MINUS = "−";
  const fix = (x, d) => Math.abs(x).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
  const signed = (x, s) => x < 0 ? MINUS : x > 0 && s ? "+" : "";
  const usd = (x, s) => x == null ? "–" : signed(x, s) + "$" + fix(x, Math.abs(x) >= 100000 ? 0 : 2);
  const price = x => x == null ? "–" : (x < 0 ? MINUS : "") +
    (Math.abs(x) >= 1000 ? fix(x, 0) : Math.abs(x) >= 10 ? fix(x, 2) : Math.abs(x) >= 0.1 ? fix(x, 4) : Math.abs(x).toPrecision(4));
  const pct = (x, s) => x == null ? "–" : signed(x, s) + fix(x * 100, Math.abs(x) < 0.01 ? 2 : 1) + "%";
  const qty = x => x.toLocaleString("en-US", {maximumFractionDigits: 8});
  const tone = x => x > 0 ? "up" : x < 0 ? "down" : "muted";
  const time = d => d.toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"});
  const date = d => d.toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short"});
  const ago = ms => {
    const m = Math.round(ms / 60e3);
    if (m < 1) return "just now";
    if (m < 60) return m + " min ago";
    const h = Math.round(m / 60);
    return h < 48 ? h + " h ago" : Math.round(h / 24) + " days ago";
  };
  const when = s => new Date(s);

  function account() {
    const pos = D.positions.map(p => {
      const s = p.side === "Long" ? 1 : -1, now = live[p.coin] ? live[p.coin].px : p.mark;
      return Object.assign({}, p, {s, now, pnl: s * p.qty * (now - p.entry), move: s * (now / p.entry - 1), value: p.qty * now});
    });
    const value = D.equity_snap + pos.reduce((a, p) => a + p.s * p.qty * (p.now - p.mark_snap), 0);
    const notional = pos.reduce((a, p) => a + p.value, 0);
    return {pos, value, notional, free: D.available == null ? null : D.available + (value - D.equity_snap),
            lev: value > 0 && pos.length ? notional / value : null};
  }

  function renderStatus() {
    const st = $("status"), fresh = Date.now() - lastLive < LIVE_FOR;
    st.classList.toggle("live", fresh && D.positions.length > 0);
    if (!D.positions.length) $("statusText").textContent = "Read " + time(when(D.snapshot_utc));
    else $("statusText").textContent = fresh ? "Live" : "Prices " + time(new Date(D.marks_live ? D.built_utc : D.snapshot_utc));
    const age = Date.now() - when(D.snapshot_utc).getTime(), b = $("banner");
    b.hidden = age < 3 * 3600e3;
    b.className = "banner" + (age > 24 * 3600e3 ? " bad" : "");
    b.textContent = "The account was last read " + ago(age) + ". Position changes and results since then are not shown yet.";
    $("foot").textContent = "Tidebot reads the account every hour (read-only) and the prices every minute. " +
      "Last account read " + ago(age) + ". Open P&L before fees; results per coin after fees and funding.";
  }

  function rangeStart(points) {
    const now = Date.now();
    if (range === "1d") return now - 864e5;
    if (range === "7d") return now - 7 * 864e5;
    return points.length ? points[0].t : now - 864e5;
  }

  // The change over the chart's range without the money moved in or out: the dollar result is the change in value
  // minus the net deposits, and the percentage chains the returns between deposits (time-weighted), so a deposit is
  // neither a gain nor a loss. With no list of deposits (or one without a dollar amount) it is the plain change in
  // value, and the note under it says so.
  function result(pts, moves) {
    const first = pts[0], last = pts[pts.length - 1];
    if (moves == null || moves.some(m => m.usd == null)) {
      return {gain: last.v - first.v, pct: first.v > 0 ? (last.v - first.v) / first.v : null};
    }
    let growth = 1, start = first.v, from = first.t;
    for (const m of moves) {
      let end = start;
      for (const p of pts) if (p.t >= from && p.t < m.t) end = p.v;      // the last value before this move
      growth = start > 0 ? growth * end / start : NaN;
      start = end + m.usd; from = m.t;
    }
    growth = start > 0 ? growth * last.v / start : NaN;
    return {gain: last.v - first.v - moves.reduce((a, m) => a + m.usd, 0), pct: isFinite(growth) ? growth - 1 : null};
  }

  const moved = x => x >= 0 ? usd(x) + " added" : usd(-x) + " taken out";

  function moveNote(moves) {
    if (moves == null) return "Deposits and withdrawals are not read yet, so they count as gain or loss here.";
    if (!moves.length) return "";
    if (moves.some(m => m.usd == null)) return "Includes money moved in or out that Kraken gave no dollar value for.";
    const added = moves.reduce((a, m) => a + Math.max(m.usd, 0), 0), out = moves.reduce((a, m) => a + Math.max(-m.usd, 0), 0);
    const parts = [added && moved(added), out && moved(-out)].filter(Boolean);
    return "Not counting " + parts.join(" and ") + (moves.length === 1 ? " on " + date(new Date(moves[0].t)) : "") + ".";
  }

  function renderChart(A) {
    const box = $("chart"), all = D.history.map(h => ({t: when(h.utc).getTime(), v: h.equity}));
    all.push({t: Date.now(), v: A.value});
    const t0 = rangeStart(all);
    let pts = all.filter(p => p.t >= t0);
    const before = all.filter(p => p.t < t0);
    if (before.length) pts.unshift({t: t0, v: before[before.length - 1].v});   // the value as the range starts
    if (pts.length < 2) pts = all.slice(-2);
    const first = pts[0], last = pts[pts.length - 1];
    const moves = D.transfers == null ? null : D.transfers.map(m => ({t: when(m.utc).getTime(), usd: m.usd}))
      .filter(m => m.t > first.t && m.t <= last.t);
    const R = result(pts, moves);
    $("delta").replaceChildren(make("span", tone(R.gain), (R.gain >= 0 ? "▲ " : "▼ ") + usd(Math.abs(R.gain)) +
                                    (R.pct == null ? "" : " (" + pct(R.pct, true) + ")")),
      make("span", null, range === "1d" ? " · past 24 hours" : range === "7d" ? " · past 7 days" : " · since " + date(new Date(first.t))));
    const note = moveNote(moves);
    $("deltaNote").textContent = note;
    $("deltaNote").hidden = !note;
    $("axisFrom").textContent = range === "1d" ? time(new Date(first.t)) : date(new Date(first.t));
    $("axisTo").textContent = "now";
    const W = Math.max(box.clientWidth, 200), H = box.clientHeight || 170, pad = 20;   // the high and low labels sit in the padding
    let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
    if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
    const tA = first.t, tB = Math.max(last.t, tA + 1);
    const X = t => (t - tA) / (tB - tA) * W, Y = v => pad + (1 - (v - lo) / (hi - lo)) * (H - 2 * pad);
    const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const color = R.gain >= 0 ? "var(--up)" : "var(--down)";
    const line = pts.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + "," + Y(p.v).toFixed(1)).join("");
    svg.innerHTML = `<defs><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/>` +
      `<stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>` +
      `<line x1="0" x2="${W}" y1="${Y(first.v).toFixed(1)}" y2="${Y(first.v).toFixed(1)}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 4"/>` +
      (moves || []).map(m => `<line x1="${X(m.t).toFixed(1)}" x2="${X(m.t).toFixed(1)}" y1="14" y2="${H}" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="3 3" opacity=".75"/>`).join("") +
      `<path d="${line}L${W},${H}L0,${H}Z" fill="url(#fade)"/>` +
      `<path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` +
      `<circle cx="${X(last.t).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="4" fill="${color}" stroke="var(--card)" stroke-width="2"/>` +
      `<line id="hair" y1="0" y2="${H}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>` +
      `<circle id="hdot" r="4" fill="${color}" stroke="var(--card)" stroke-width="2" visibility="hidden"/>`;
    box.querySelectorAll("svg,.ylab,.mv").forEach(e => e.remove());
    box.prepend(svg);
    const top = make("span", "ylab num", usd(hi)), bot = make("span", "ylab num", usd(lo));
    top.style.top = "0"; bot.style.bottom = "0";
    box.append(top, bot);
    const placed = [];
    for (const m of moves || []) {          // a deposit's label beside its line, on the side with room
      if (m.usd == null) continue;
      const lab = make("span", "mv num", (m.usd >= 0 ? "+" : MINUS) + "$" + fix(m.usd, Math.abs(m.usd) >= 100 ? 0 : 2));
      const x = X(m.t) / W * 100;
      if (x > 50) lab.style.right = "calc(" + (100 - x).toFixed(2) + "% + 4px)"; else lab.style.left = "calc(" + x.toFixed(2) + "% + 4px)";
      box.append(lab);
      const r = lab.getBoundingClientRect();  // a label that would cover an earlier one goes a line lower
      let row = 0;
      while (placed.some(p => p.row === row && r.left < p.right + 4 && r.right > p.left - 4)) row++;
      if (row) lab.style.top = (row * (r.height + 3)).toFixed(1) + "px";
      placed.push({row, left: r.left, right: r.right});
    }
    box.setAttribute("aria-label", "Account value from " + usd(first.v) + " to " + usd(last.v));
    const tip = $("tip"), hair = svg.querySelector("#hair"), hdot = svg.querySelector("#hdot");
    const show = ev => {
      const r = box.getBoundingClientRect(), x = Math.min(Math.max(ev.clientX - r.left, 0), r.width) * W / r.width;
      let bi = 0;
      pts.forEach((p, i) => { if (Math.abs(X(p.t) - x) < Math.abs(X(pts[bi].t) - x)) bi = i; });
      const best = pts[bi], bx = X(best.t), by = Y(best.v);
      hair.setAttribute("x1", bx); hair.setAttribute("x2", bx); hair.setAttribute("visibility", "visible");
      hdot.setAttribute("cx", bx); hdot.setAttribute("cy", by); hdot.setAttribute("visibility", "visible");
      const since = (moves || []).filter(m => m.usd != null && m.t <= best.t && (bi === 0 || m.t > pts[bi - 1].t));
      tip.replaceChildren(usd(best.v) + " · " + (best === last ? "now" : date(new Date(best.t)) + " " + time(new Date(best.t))));
      if (since.length) tip.append(make("div", null, moved(since.reduce((a, m) => a + m.usd, 0))));
      tip.style.display = "block";
      const half = tip.offsetWidth / 2;                // the whole tip stays inside the chart
      tip.style.left = Math.min(Math.max(bx * r.width / W, half), r.width - half) + "px";
    };
    const hide = () => { tip.style.display = "none"; hair.setAttribute("visibility", "hidden"); hdot.setAttribute("visibility", "hidden"); };
    box.onpointermove = show; box.onpointerdown = show; box.onpointerleave = hide; box.onpointercancel = hide;
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.range === range)));
  }

  function renderPositions(A) {
    const box = $("positions");
    $("posCount").textContent = A.pos.length;
    if (!A.pos.length) { box.replaceChildren(make("div", "card empty", "No open positions.")); return; }
    box.replaceChildren(...A.pos.map(p => {
      const card = make("article", "card");
      const top = make("div", "pos-top"), coin = make("div", "coin", p.coin);
      coin.append(make("span", "pill " + (p.s > 0 ? "long" : "short"), p.side));
      const pnl = make("div", "pnl num " + tone(p.pnl), usd(p.pnl, true));
      pnl.append(make("small", null, pct(p.move, true)));
      top.append(coin, pnl);
      const cell = (grid, k, v, sub, cls) => {
        const c = make("div");
        c.append(make("span", null, k), make("b", "num", v));
        if (sub) c.append(make("small", "num " + (cls || "muted"), sub));
        grid.append(c);
      };
      const g1 = make("div", "grid4"), g2 = make("div", "grid4 minor");
      cell(g1, "Size", qty(p.qty)); cell(g1, "Entry", price(p.entry)); cell(g1, "Now", price(p.now)); cell(g1, "Value", usd(p.value));
      if (D.orders_read) {
        cell(g2, "Stop", p.stop == null ? "none" : price(p.stop), p.stop == null ? null : pct(p.stop / p.now - 1, true));
        cell(g2, "Take profit", p.tp == null ? "none" : price(p.tp), p.tp == null ? null : pct(p.tp / p.now - 1, true));
      } else {
        cell(g2, "Stop", "not read"); cell(g2, "Take profit", "not read");
      }
      cell(g2, "Funding", p.funding == null ? "–" : usd(p.funding, true));
      card.append(top, g1, g2);
      return card;
    }));
  }

  // Each coin's result: what the account booked on it (Kraken's P&L, fees and funding) plus its open position now,
  // and the total of all coins under them.
  function renderCoins(A) {
    const box = $("coins"), open = {};
    for (const p of A.pos) open[p.coin] = (open[p.coin] || 0) + p.pnl;
    const rows = (D.coins || []).map(c => ({coin: c.coin, booked: c.usd, open: open[c.coin]}));
    for (const coin of Object.keys(open)) if (!rows.some(r => r.coin === coin)) rows.push({coin, booked: null, open: open[coin]});
    const first = (D.coins || []).map(c => c.since).sort()[0];
    $("coinsSince").textContent = first ? "since " + date(when(first)) : "";
    if (!rows.length) {
      box.replaceChildren(make("div", "empty", D.coins == null ? "Results show up here after the next hourly account read." : "No trades yet."));
      return;
    }
    const total = r => (r.booked || 0) + (r.open || 0);
    const line = (ic, name, sub, x) => {
      const row = make("div", "row"), what = make("div", "what");
      what.append(make("div", "l1", name), make("div", "l2 num", sub));
      row.append(make("div", "ic", ic), what, make("div", "amt num " + tone(x), usd(x, true)));
      return row;
    };
    const els = rows.map(r => line(r.coin.slice(0, 4), r.coin, [r.booked != null && "realized " + usd(r.booked, true),
      r.open != null && "open " + usd(r.open, true)].filter(Boolean).join(" · ") || "no result yet", total(r)));
    if (rows.length > 1) els.push(line("All", "All coins", "realized + open", rows.reduce((a, r) => a + total(r), 0)));
    box.replaceChildren(...els);
  }

  function render() {
    const A = account();
    $("value").textContent = usd(A.value);
    document.title = usd(A.value) + " · Tidebot";
    $("free").textContent = usd(A.free);
    $("free").className = "num " + (A.free != null && A.free < 0 ? "down" : "");
    $("lev").textContent = A.lev == null ? "–" : A.lev.toFixed(1) + "×";
    $("lev").className = "num " + (A.lev >= 10 ? "down" : A.lev >= 5 ? "warn" : "");
    $("notional").textContent = usd(A.notional);
    renderStatus();
    renderChart(A);
    renderPositions(A);
    renderCoins(A);
  }

  async function refreshPrices() {
    if (document.hidden || !D.positions.length) return;
    let ok = false;
    await Promise.all([...new Set(D.positions.map(p => p.coin))].map(async c => {
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 10e3);
      try {
        const r = await fetch("https://api.kraken.com/0/public/Ticker?pair=" + encodeURIComponent(SPOT[c] || c + "USD"), {signal: ctl.signal});
        const j = await r.json(), k = j && j.result && Object.keys(j.result)[0];
        const v = k ? parseFloat(j.result[k].c[0]) : NaN;
        if (v > 0 && isFinite(v)) { live[c] = {px: v, t: Date.now()}; ok = true; }
      } catch (e) { /* this coin keeps its last price */ }
      clearTimeout(to);
    }));
    if (ok) lastLive = Date.now();
    render();
  }

  async function refreshData() {
    if (document.hidden) return;
    try {
      const r = await fetch("data.json?t=" + Date.now(), {cache: "no-store"});
      if (!r.ok) return;
      const n = await r.json();
      if (n && Array.isArray(n.positions) && n.built_utc !== D.built_utc) { D = n; render(); }
    } catch (e) { /* keep the data we have */ }
  }

  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    range = b.dataset.range;
    try { localStorage.setItem("tidebot.range", range); } catch (e) { /* not remembered */ }
    render();
  }));
  let resizeT;
  window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(render, 150); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { refreshData(); refreshPrices(); } });
  render();
  refreshPrices();
  setInterval(refreshPrices, 60e3);
  setInterval(refreshData, 5 * 60e3);
  setInterval(renderStatus, 30e3);
})();
</script>
</body></html>
