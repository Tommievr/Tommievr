<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Open Positions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* One narrow column: the account value on top, then one card per open position. */
:root{
  --bg:#f3f5f4; --card:#ffffff; --fg:#17201c; --muted:#5f6d66; --line:#dbe2de;
  --up:#14843f; --down:#c4302b;
  --display:"Archivo",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --card:#171e1b; --fg:#e8eeeb; --muted:#93a29a; --line:#26302c;
  --up:#3fcf72; --down:#ff6b61; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --card:#171e1b; --fg:#e8eeeb; --muted:#93a29a; --line:#26302c;
  --up:#3fcf72; --down:#ff6b61; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);font-size:14px;padding:16px;padding-block:18px 28px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1{font-size:1.05rem;margin:0;letter-spacing:.02em;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.big{font-size:2.1rem;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sym{font-weight:800;font-size:1.15rem}
.side{font-size:.72rem;color:var(--muted);margin-left:6px;font-weight:500}
.pct{font-size:1.25rem;font-weight:600}
.price{font-size:1.5rem;font-weight:600;line-height:1.1}.price small{font-size:.72rem;color:var(--muted);font-weight:400;font-family:var(--display);margin-right:6px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.row b{color:var(--fg);font-weight:600}
.up{color:var(--up)} .down{color:var(--down)}
.empty{color:var(--muted);font-size:.9rem;padding:24px 4px;text-align:center}
footer{font-size:.72rem;color:var(--muted);line-height:1.5}
</style></head><body>
<div class="wrap">
  <h1>Open positions</h1>
  <section class="card" id="acct"></section>
  <div id="list" style="display:flex;flex-direction:column;gap:10px"></div>
  <footer>Prices are live Kraken prices, read by this page every minute. Positions refresh every few hours. P&amp;L % is the price move since entry; leverage multiplies it on the account.</footer>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
const $=id=>document.getElementById(id);
function el(tag,attrs,text){const e=document.createElement(tag);for(const k in attrs||{})e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;return e}
function fp(v){if(v==null)return"–";const a=Math.abs(v);const d=a>=1000?0:a>=10?2:4;return v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
function sp(v){return v==null?"–":(v>=0?"+":"")+v.toFixed(2)+"%"}
function usd(v){if(v==null)return"–";return(v>=0?"+$":"−$")+Math.abs(v).toFixed(2)}
function cls(v){return v==null?"":v>=0?"up":"down"}
const hm=u=>new Date(u).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:false});
const dhm=u=>new Date(u).toLocaleString([],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false});
// the age is checked here too: a page that stops being rebuilt must not show old positions as live
const STALE_MS=8*3600e3,stale=d=>d.equity!=null&&Date.now()-Date.parse(d.updated_utc)>STALE_MS;
function render(d){
  const a=$("acct");a.replaceChildren();
  const msg=d.error||(stale(d)?"Positions are more than 8 hours old.":null);
  if(msg){a.append(el("div",{class:"row"},msg));}
  const upnl=d.positions.reduce((s,p)=>s+(p.pnl_usd||0),0);
  const t=el("div",{class:"top"});t.append(el("span",{class:"row"},"Account value"),el("span",{class:"num "+cls(upnl)},d.positions.length?usd(upnl)+" open P&L":""));
  a.append(t,el("div",{class:"big num"},d.equity!=null?"$"+d.equity.toFixed(2):"–"));
  const r=el("div",{class:"row"});
  r.append(el("span",{},d.available!=null?"Free margin $"+d.available.toFixed(2):""),el("span",{},(d.live?"Live prices ":"Prices ")+hm(d.priced_utc||d.updated_utc)+" · Positions "+dhm(d.updated_utc)));
  a.append(r);
  const box=$("list");box.replaceChildren();
  if(!d.positions.length){if(d.equity!=null)box.append(el("div",{class:"empty"},"No open positions."));return}
  for(const p of d.positions){
    const sd=p.side==="Long"?1:-1,pct=(p.mark/p.entry-1)*100*sd,notional=p.qty*p.mark;
    const c=el("article",{class:"card"}),top=el("div",{class:"top"}),l=el("div");
    l.append(el("span",{class:"sym"},p.coin),el("span",{class:"side"},p.side));
    top.append(l,el("span",{class:"pct num "+cls(pct)},sp(pct)));
    const pr=el("div",{class:"price num"});pr.append(el("small",{},"Now"),el("span",{class:cls(pct)},fp(p.mark)));
    const r0=el("div",{class:"row"}),sz=el("span");sz.append("Size ",el("b",{class:"num"},(+p.qty.toPrecision(6))+" "+p.coin)," · $"+notional.toFixed(0));r0.append(sz);
    const r1=el("div",{class:"row"}),e=el("span"),lv=el("span");
    e.append("Entry ",el("b",{class:"num"},fp(p.entry)));
    lv.append("Lev ",el("b",{class:"num"},d.equity?(notional/d.equity).toFixed(2)+"x":"–"));
    r1.append(e,lv,el("span",{class:"num "+cls(p.pnl_usd)},usd(p.pnl_usd)));
    c.append(top,pr,r0,r1);box.append(c);
  }
}
const base=JSON.parse($("data").textContent);
// Kraken spot names: BTC is XBT, DOGE is XDG; one request per coin, so an unknown pair never blocks the others
const SPOT={BTC:"XBT",DOGE:"XDG"};
async function live(){
  if(stale(base))return;
  const d=structuredClone(base);let move=0,got=0;
  await Promise.all(d.positions.map(async p=>{
    try{
      const code=(SPOT[p.coin]||p.coin)+"USD";
      const res=(await (await fetch("https://api.kraken.com/0/public/Ticker?pair="+code,{cache:"no-store"})).json()).result||{};
      const k=Object.keys(res)[0];if(!k)return;
      const m=+res[k].c[0];if(!(m>0))return;
      const sd=p.side==="Long"?1:-1;move+=(m-p.mark)*p.qty*sd;p.pnl_usd=(m-p.entry)*p.qty*sd;p.mark=m;got++;
    }catch(e){}
  }));
  if(!got)return;
  if(d.equity!=null)d.equity+=move;
  d.live=true;d.priced_utc=new Date().toISOString();render(d);
}
render(base);live();setInterval(live,60000);
setTimeout(()=>location.reload(),10*60000);
</script>
</body></html>
