name: bot-dashboard

# Hourly phone dashboard of the live 5-coin bot (dashboard/build.py), published on GitHub Pages.
# Read-only: it reads Tommievr/tradingbot's committed live journal with a read-only token and the
# public Kraken Futures prices. No Kraken keys, no orders.
# GitHub's hourly cron proved unreliable (no scheduled runs at all for hours), so each run also
# waits until the next full hour and starts the next run itself; the concurrency group keeps one chain.
# dashboard-watchdog.yml restarts the chain when a run dies or sits queued without a runner.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # only to start the next run

concurrency:
  group: bot-dashboard
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build page
        env:
          TRADINGBOT_READ_TOKEN: ${{ secrets.TRADINGBOT_READ_TOKEN }}
        run: python3 dashboard/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  next-run:
    needs: build-deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Wait for the next full hour, then start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s)
          next=$(( (now / 3600 + 1) * 3600 ))
          sleep $(( next - now ))
          gh workflow run bot-dashboard.yml -R "$GITHUB_REPOSITORY" --ref main
