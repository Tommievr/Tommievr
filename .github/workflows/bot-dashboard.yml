name: bot-dashboard

# Phone dashboard of the live 5-coin bot (dashboard/build.py), published on GitHub Pages.
# Read-only: it reads Tommievr/tradingbot's committed live journal with a read-only token. No Kraken keys,
# no orders. The page itself fetches live Kraken prices in the browser (Kraken's spot API; the futures API
# does not allow browser reads), so it only needs a rebuild
# when the bot has run. Short jobs only: once an hour a seconds-long check rebuilds the page when the live
# journal changed since the last build (i.e. after each live bot run) or the last build is over 3 h old
# (a missed hour is caught up by the next one).
# A file dashboard/PAUSED makes the build publish the "paused" page instead (remove the schedule too).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bot-dashboard
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      build: ${{ steps.gate.outputs.build }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - id: gate
        name: Rebuild only after a bot run or every 3 h
        env:
          GH_TOKEN: ${{ secrets.TRADINGBOT_READ_TOKEN }}
        run: |
          sha=$(gh api "repos/Tommievr/tradingbot/commits?path=ruleb_tp2/state_live/5coin/ruleb_tp2_live_journal.jsonl&sha=main&per_page=1" -q '.[0].sha' || echo unknown)
          meta=$(curl -fsS "https://tommievr.github.io/Tommievr/meta.json" || echo '{}')
          old=$(echo "$meta" | jq -r '.journal_sha // ""')
          built=$(echo "$meta" | jq -r '.built_utc // "1970-01-01T00:00:00Z"')
          age=$(( $(date -u +%s) - $(date -u -d "$built" +%s) ))
          echo "journal $sha (last build $old), last build ${age}s ago"
          build=false
          if [ "$sha" != "$old" ] || [ "$age" -gt 10500 ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then build=true; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build-deploy:
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build page
        env:
          TRADINGBOT_READ_TOKEN: ${{ secrets.TRADINGBOT_READ_TOKEN }}
          JOURNAL_SHA: ${{ needs.check.outputs.sha }}
        run: |
          if [ -f dashboard/PAUSED ]; then
            mkdir -p site && cp dashboard/paused.html site/index.html
            echo '{"paused": true}' > site/meta.json
          else
            python3 dashboard/build.py
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
