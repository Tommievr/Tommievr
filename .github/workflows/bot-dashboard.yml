name: bot-dashboard

# Public "Open positions" page on GitHub Pages (dashboard/positions.py): every open position of the Kraken
# Futures account and the account value, read once an hour with a READ-ONLY key (repository secrets
# KRAKEN_READ_KEY / KRAKEN_READ_SECRET: it can look, never trade or withdraw). No name and no bot data on the
# page; the browser re-prices the positions every minute from Kraken's public spot prices.
# Without the key the old bot dashboard (dashboard/build.py) is built. A file dashboard/PAUSED makes the build
# publish the blank offline page instead (remove the schedule too).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bot-dashboard
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build page
        env:
          KRAKEN_READ_KEY: ${{ secrets.KRAKEN_READ_KEY }}
          KRAKEN_READ_SECRET: ${{ secrets.KRAKEN_READ_SECRET }}
          TRADINGBOT_READ_TOKEN: ${{ secrets.TRADINGBOT_READ_TOKEN }}
        run: |
          if [ -f dashboard/PAUSED ]; then
            mkdir -p site && cp dashboard/paused.html site/index.html
            echo '{"paused": true}' > site/meta.json
          elif [ -n "$KRAKEN_READ_KEY" ] && [ -n "$KRAKEN_READ_SECRET" ]; then
            python3 dashboard/positions.py
          else
            python3 dashboard/build.py
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
