name: bot-dashboard

# Public bot dashboard on GitHub Pages (dashboard/build.py + dashboard/template.html): the live 5-coin trend bot
# ("5-coin trend bot (test)"), counted from its restart on 7 Oct 2026 20:05 UTC at $95.19. It shows the open legs,
# closed trades, fees, funding and the value history; the browser re-prices the open legs every minute from Kraken's
# public prices.
# The build reads the bot's live journal and state from the private repo Tommievr/tradingbot (main) with the
# read-only token TRADINGBOT_READ_TOKEN. No Kraken key is in this repo. A file dashboard/PAUSED publishes the blank
# offline page instead.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/bot-dashboard.yml"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bot-dashboard
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build page
        env:
          TRADINGBOT_READ_TOKEN: ${{ secrets.TRADINGBOT_READ_TOKEN }}
        run: |
          if [ -f dashboard/PAUSED ]; then
            mkdir -p site && cp dashboard/paused.html site/index.html
            echo '{"paused": true}' > site/meta.json
          else
            python3 dashboard/build.py
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
